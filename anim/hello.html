<script>
  const TOTAL_MS = 2600;                                  // 一遍写完的时长
  const GAP_MS = 120;                                     // 单词写完到点句点之间的停顿
  const PAUSE_MS = 1000;                                  // 两遍之间的停顿
  const DOT_MAX = 5;                                      // 路径长度小于此视作“点”（句点）
  const paths = [...document.querySelectorAll('#stage path')];
  const lens = paths.map(p => p.getTotalLength());
  const sum = lens.reduce((a, b) => a + b, 0);
  const scale = (TOTAL_MS - GAP_MS * (paths.length - 1)) / sum;

  paths.forEach((p, i) => {                               // 静态样式：未播放时整条藏起来
    if (lens[i] < DOT_MAX) { p.style.strokeWidth = '0px'; return; }   // 点不走虚线，直接缩没
    p.style.strokeDasharray = lens[i];
    p.style.strokeDashoffset = lens[i];
  });

  let anims = [];

  function play() {
    anims.forEach(a => a.cancel());
    let at = 0;
    anims = paths.map((p, i) => {
      let anim;
      if (lens[i] < DOT_MAX) {
        // 点：单词写完后轻轻“点”一下，带一点回弹
        const w = p.getAttribute('stroke-width') || 123.1;
        anim = p.animate([{ strokeWidth: '0px' }, { strokeWidth: w + 'px' }],
          { duration: 240, delay: at, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)', fill: 'both' });
        at += 240 + GAP_MS;
      } else {
        anim = p.animate(
          [{ strokeDashoffset: lens[i] }, { strokeDashoffset: 0 }],
          { duration: lens[i] * scale, delay: at, easing: 'linear', fill: 'both' });
        at += lens[i] * scale + GAP_MS;
      }
      return anim;
    });
  }

  (function loop() {
    play();
    setTimeout(loop, TOTAL_MS + PAUSE_MS);                // 循环播放
  })();
</script>
